name: Deploy Laravel to IIS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, fileinfo, sqlite3, pdo_sqlite, PDO_SQLSRV

      - name: Install Composer dependencies
        run: |
          composer install --ignore-platform-reqs

      - name: Generate Laravel environment file
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Laravel migrations
        run: |
          php artisan migrate --force

      - name: Cache Laravel routes and configuration
        run: |
          php artisan route:cache
          php artisan config:cache

      - name: Deploy to IIS
        uses: ChristopheLav/iis-deploy@v1
        with:
          website-name: 'AgendaFEN'
          msdeploy-service-url: ${{ secrets.IIS_AGENDA_URL }}
          msdeploy-username: ${{ secrets.IIS_USERNAME }}
          msdeploy-password: ${{ secrets.IIS_PASSWORD }}
          source-path: ${{ github.workspace }}\website\publish
